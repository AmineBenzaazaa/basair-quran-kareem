                          - generic [ref=e237]:
                            - generic [ref=e238]: paragraphs 19
                            - textbox [ref=e239]: يمتاز هذا الجزء بتجاوزه للتحليل اللغوي التقليدي الذي يقتصر غالباً على توضيح المعنى المعجمي أو الاشتقاقي، إذ يقدم دراسة شاملة للأبعاد السياقية التي تتبناها المصطلحات ضمن البنية القرآنية. فاللغة القرآنية تتميز بنظام داخلي خاص يجعل فهم المصطلحات يتجاوز حدود المعاجم إلى فضاء التفاعل بين السياق والتركيب والغاية المقصودة. ومن ثم، يقوم البحث بتحليل المصطلح ضمن الإطار العام للسياق القرآني والنظام الخطابي الذي تحكمه القواعد الإلهية المبيّنة في الجزء الأول، مما يوفر رؤية أكثر شمولية ودقة لإدراك المعنى أو الدلالة. وعليه، يُعرض تحليل معمق لبعض هذه الدلالات بهدف تمييز الدلالة الأصلية المراد بها في النص القرآني عن الدلالات أو المعاني التي قد تتأثر بالسياقات اللغوية أو بالأفكار العقائدية المترتبة عليها؛ وذلك ليس بغرض ابتكار معانٍ جديدة، بل بإعادة بناء الدلالة بما يتوافق مع الطريقة المحكمة لتراكيب الآيات ويلبي احتياجات القارئ المعاصر، شرط ألا يؤدي ذلك إلى طمس جوهر النص أو إخضاعه لتأويلات خارجية غير مبررة.
