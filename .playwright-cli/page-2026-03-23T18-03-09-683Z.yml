                            - textbox [ref=e190]: وعليه يُعتبر هذا العمل بأجزائه الثلاثة لبنة أولى لمشروع معرفي يرتكز على دراسة علميه مبنيه على قواعد أساسيّة وضعها الله تعالى بهدف فتح باب تطوير فهم النصوص القرآنية للوصول الى جوهر الخطاب المحكم وإغلاق الباب أمام التعقيدات التفسيرية غير الضروريّة والانطباعات الشخصية التي قد تحرف المتدبر عن المقصد الحقيقي للنص القرآني؛ مما يجعل القارئ قادرًا على الجمع بين دقه الفهم وعمق التدبر بالإضافة إلى النقد البناء والتطور الفقهي المستمر والمتوازن.
